<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5595">
  <meta name="description" content="Inicio de sesión de SIRA, Sistema Integral de Registro de Aspirantes del ITSON.">
  <title>SIRA - ITSON | Iniciar sesión</title>
  <link rel="stylesheet" href="/login/styles.css">
  <script src="/login/app.js" defer></script>
</head>
<body>
  <main class="login-shell" aria-labelledby="login-title">
    <section class="brand-panel" aria-label="Identidad institucional SIRA e ITSON">
      <div class="brand-lockup">
        <span class="itson-wordmark">ITSON<sup>®</sup></span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="sira-wordmark">SIRA</span>
      </div>
      <div class="brand-copy">
        <h1>Sistema Integral de<br>Registro de Aspirantes</h1>
      </div>
      <div class="brand-waves" aria-hidden="true"><i></i><b></b></div>
    </section>

    <section class="form-panel">
      <div class="form-content">
        <header class="form-heading">
          <p class="eyebrow">ITSON · SIRA</p>
          <h2 id="login-title">Iniciar sesión</h2>
          <p>Accede con tu cuenta institucional</p>
        </header>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="identifier">Correo o ID</label>
            <div class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
              <input id="identifier" name="identifier" type="text" autocomplete="username" placeholder="Ingresa tu correo institucional o ID" required maxlength="254">
            </div>
          </div>

          <div class="field-group">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required maxlength="256">
              <button class="password-toggle" id="toggle-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div class="form-links"><a href="#recuperacion" id="forgot-password">¿Olvidaste tu contraseña?</a></div>
          <p class="feedback" id="feedback" role="alert" aria-live="polite" hidden></p>
          <button class="submit-button" id="submit-button" type="submit"><span class="button-label">Continuar</span><span class="spinner" aria-hidden="true"></span></button>
        </form>

        <p class="form-footnote">Sistema Integral de Registro de Aspirantes · ITSON</p>
      </div>
    </section>
  </main>
</body>
</html>
