<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIRA | Sesión iniciada</title>
  <link rel="stylesheet" href="/login/styles.css">
  <style>
    .app-card{width:min(720px,calc(100% - 32px));margin:8vh auto;padding:clamp(28px,5vw,52px);background:#fff;border:1px solid #e1e5ea;border-radius:18px;box-shadow:0 10px 30px #142b4312}.app-card h1{margin:0 0 8px;color:#124f83}.app-card p{color:#536477}.app-card button{margin-top:20px;padding:13px 22px;border:0;border-radius:8px;background:#075b9e;color:white;font-weight:700;cursor:pointer}
  </style>
  <script src="/app/app.js" defer></script>
</head>
<body>
  <main class="app-card">
    <p class="eyebrow">SIRA · ITSON</p>
    <h1 id="welcome">Sesión iniciada</h1>
    <p id="profile">Cargando información de tu cuenta…</p>
    <p id="role"></p>
    <button id="logout" type="button">Cerrar sesión</button>
  </main>
</body>
</html>
