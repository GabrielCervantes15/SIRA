openapi: 3.0.3
info:
  title: SIRA — CRM de Seguimiento de Aspirantes del ITSON
  version: 0.2.0
  description: |
    Especificación HTTP REST del backend de **SIRA** (Monolito Modular en Node.js >= 20 con ESM nativo y cero dependencias externas), correspondiente al cierre del **Sprint 2**.

    ### Autenticación y Autorización
    - Todas las rutas protegidas utilizan la cookie de sesión `sira_session` (`HttpOnly`, `SameSite=Lax`, y `Secure` cuando `NODE_ENV=production`).
    - Los roles soportados son `administrador` y `colaborador`.
    - Las rutas de `Monitoreo`, `Colaboradores` y `Mensajes` aceptan tanto el prefijo versionado `/api/v1/...` como el alias `/api/...`.

    ### Zona Horaria Institucional
    - Toda validación de horario permitido de envío (HU 1 y HU 9) se evalúa en el servidor bajo la zona horaria fija `America/Hermosillo` (`UTC-07:00`, sin horario de verano).
servers:
  - url: http://localhost:3000
    description: Servidor local de desarrollo / contenedor Docker
tags:
  - name: Salud
    description: Estado operativo del backend, base de datos y bus de eventos.
  - name: Autenticación
    description: Inicio, consulta y cierre de sesión institucional (BASE-7, EQ-15, EQ-18).
  - name: Monitoreo
    description: Cartera de aspirantes, filtros, expediente, línea de tiempo y conversación (HU 2, HU 3 y HU 4).
  - name: Colaboradores
    description: Administración de colaboradores, registro en 3 pasos, casos especiales, transferencia manual y baja con reasignación equitativa (HU 6 y HU 7).
  - name: Mensajes - Configuración
    description: Parámetros de espera, jornada laboral por día y bitácora de auditoría (HU 9 · EQ-106, EQ-107, EQ-108).
  - name: Mensajes - Catálogo IA
    description: Catálogo de mensajes predefinidos de solo lectura (HU 8 · EQ-95, EQ-96, EQ-97).
  - name: Disparo Automático
    description: Vista previa, creación idempotente de lotes de reactivación y consulta de resultados (HU 1 · EQ-81, EQ-82, EQ-83, EQ-87).
  - name: Webhooks WhatsApp
    description: Verificación de suscripción y recepción firmada HMAC-SHA256 de WhatsApp Cloud API (BASE-11 · EQ-115).

components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: sira_session
      description: Cookie de sesión `HttpOnly` emitida por `POST /api/v1/auth/login`.

  parameters:
    AspiranteIdPath:
      name: id
      in: path
      required: true
      description: Identificador interno (`asp-001`) o folio de solicitud (`FOL-2026-0001`) del aspirante.
      schema:
        type: string
        example: asp-001
    ColaboradorIdPath:
      name: id
      in: path
      required: true
      description: ID institucional numérico del colaborador (5 a 20 dígitos).
      schema:
        type: string
        pattern: '^\d{5,20}$'
        example: '00000252115'

  schemas:
    ErrorRespuesta:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: SIN_PERMISO
        mensaje:
          type: string
          example: No tienes permisos para acceder a esta funcionalidad.
        errores:
          type: object
          additionalProperties:
            type: string
          description: Mapa opcional de errores de validación por campo.
        detalle:
          type: object
          description: Información estructurada adicional (p. ej. estado del horario en 409 FUERA_DE_HORARIO_PERMITIDO).

    UsuarioSesion:
      type: object
      required:
        - idInstitucional
        - nombreCompleto
        - rol
      properties:
        idInstitucional:
          type: string
          example: '00000252115'
        nombreCompleto:
          type: string
          example: Sebastián Bórquez Huerta
        correoInstitucional:
          type: string
          nullable: true
          example: sebastian.borquez252115@potros.itson.edu.mx
        telefono:
          type: string
          nullable: true
          example: '+526441112233'
        rol:
          type: string
          enum: [administrador, colaborador]
          example: colaborador

    PerfilDirectorio:
      type: object
      required:
        - idInstitucional
        - nombreCompleto
      properties:
        idInstitucional:
          type: string
          example: '00000260001'
        nombreCompleto:
          type: string
          example: Valeria Ochoa Ruiz
        correoInstitucional:
          type: string
          nullable: true
          example: valeria.ochoa260001@potros.itson.edu.mx
        telefono:
          type: string
          nullable: true
          example: '+526449990011'
        fotoUrl:
          type: string
          nullable: true
          example: https://ad.itson.mx/fotos/00000260001.jpg

    ColaboradorResumen:
      type: object
      required:
        - idInstitucional
        - campus
        - carreras
        - activo
        - casosEspeciales
        - fechaRegistro
        - totalAspirantes
      properties:
        idInstitucional:
          type: string
          example: '00000252115'
        nombreCompleto:
          type: string
          nullable: true
          example: Sebastián Bórquez Huerta
        correoInstitucional:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        fotoUrl:
          type: string
          nullable: true
        campus:
          type: string
          example: Campus Obregón Náinari
        carreras:
          type: array
          items:
            type: string
          example: [Ingeniería en Software, Licenciatura en Administración]
        activo:
          type: boolean
          example: true
        casosEspeciales:
          type: boolean
          example: false
        periodoBaja:
          type: object
          nullable: true
          properties:
            indefinido:
              type: boolean
            desde:
              type: string
              format: date
            hasta:
              type: string
              format: date
              nullable: true
        fechaRegistro:
          type: string
          format: date-time
        totalAspirantes:
          type: integer
          minimum: 0
          example: 40

    AspiranteResumen:
      type: object
      properties:
        id:
          type: string
          example: asp-001
        folioSolicitud:
          type: string
          example: FOL-2026-0001
        nombreCompleto:
          type: string
          example: Mariana López Soto
        correo:
          type: string
          example: mariana.lopez@ejemplo.mx
        telefono:
          type: string
          example: '+526441000001'
        campus:
          type: string
          example: Campus Obregón Náinari
        carreraSolicitada:
          type: string
          example: Ingeniería en Software
        preparatoriaProcedencia:
          type: string
          example: CBTIS 37
        periodo:
          type: string
          example: '2027-1'
        fechaSolicitud:
          type: string
          format: date-time
        estadoSolicitud:
          type: string
          enum: [RECIBIDA, EN_REVISION, CONSTANCIA_RECHAZADA, ACEPTADA, RECHAZADA]
        semaforo:
          type: string
          enum: [ROJO, NARANJA, AMARILLO, VERDE]
        colaboradorId:
          type: string
          nullable: true
        fechaUltimaActividad:
          type: string
          format: date-time
        fechaUltimaNotificacion:
          type: string
          format: date-time
          nullable: true
        vecesNotificado:
          type: integer
          minimum: 0

    EventoHistorialAspirante:
      type: object
      properties:
        id:
          type: string
          example: ev-001
        aspiranteId:
          type: string
          example: asp-001
        tipoEvento:
          type: string
          enum:
            - MENSAJE_ENVIADO
            - CONSTANCIA_ENTREGADA
            - CAMBIO_ESTADO
            - RECHAZO_SOLICITUD
            - NOTA_SEGUIMIENTO
            - MENSAJE_AUTOMATICO
        titulo:
          type: string
          example: Constancia entregada
        detalle:
          type: string
          nullable: true
        motivoRechazo:
          type: string
          nullable: true
        autorTipo:
          type: string
          enum: [SISTEMA, IA, COLABORADOR, REGISTRO_ESCOLAR]
        autorId:
          type: string
          nullable: true
        fechaEvento:
          type: string
          format: date-time
        metadatos:
          type: object

    MensajeConversacion:
      type: object
      properties:
        id:
          type: string
          example: msg-001
        aspiranteId:
          type: string
          example: asp-001
        direccion:
          type: string
          enum: [ENTRANTE, SALIENTE]
        remitenteTipo:
          type: string
          enum: [ASPIRANTE, BOT_IA, COLABORADOR, SISTEMA]
        remitenteId:
          type: string
          nullable: true
        contenido:
          type: string
          example: Hola, ya subí mi constancia de estudios.
        tipoContenido:
          type: string
          enum: [TEXTO, IMAGEN, DOCUMENTO, AUDIO]
        estadoEntrega:
          type: string
          enum: [PENDIENTE, ENVIADO, ENTREGADO, LEIDO, FALLIDO]
        whatsappMessageId:
          type: string
          nullable: true
        fecha:
          type: string
          format: date-time

    ParametroTiempo:
      type: object
      required:
        - valor
        - unidad
      properties:
        valor:
          type: integer
          minimum: 1
          maximum: 720
          description: Entero positivo cuyo equivalente en horas debe estar entre 1 h y 720 h (30 días).
          example: 24
        unidad:
          type: string
          enum: [horas, dias]
          example: horas

    JornadaDia:
      type: object
      required:
        - habilitado
        - inicio
        - fin
      properties:
        habilitado:
          type: boolean
          example: true
        inicio:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Hora de inicio en formato `HH:MM` (24 h) si `habilitado=true`, o `null` si `habilitado=false`.
          example: '08:00'
        fin:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Hora de fin en formato `HH:MM` (`inicio < fin`) si `habilitado=true`, o `null` si `habilitado=false`.
          example: '18:00'

    JornadaSemanal:
      type: object
      required:
        - lunes
        - martes
        - miercoles
        - jueves
        - viernes
        - sabado
        - domingo
      properties:
        lunes:
          $ref: '#/components/schemas/JornadaDia'
        martes:
          $ref: '#/components/schemas/JornadaDia'
        miercoles:
          $ref: '#/components/schemas/JornadaDia'
        jueves:
          $ref: '#/components/schemas/JornadaDia'
        viernes:
          $ref: '#/components/schemas/JornadaDia'
        sabado:
          $ref: '#/components/schemas/JornadaDia'
        domingo:
          $ref: '#/components/schemas/JornadaDia'

    ConfiguracionMensajes:
      type: object
      required:
        - zonaHoraria
        - tiempoEsperaRespuesta
        - tiempoEsperaContactoPrevio
        - jornada
      properties:
        zonaHoraria:
          type: string
          enum: [America/Hermosillo]
          example: America/Hermosillo
        tiempoEsperaRespuesta:
          $ref: '#/components/schemas/ParametroTiempo'
        tiempoEsperaContactoPrevio:
          $ref: '#/components/schemas/ParametroTiempo'
        jornada:
          $ref: '#/components/schemas/JornadaSemanal'
        actualizadoEn:
          type: string
          format: date-time
        actualizadoPor:
          type: string
          nullable: true
        equivalenciasHoras:
          type: object
          properties:
            tiempoEsperaRespuestaHoras:
              type: integer
              example: 24
            tiempoEsperaContactoPrevioHoras:
              type: integer
              example: 48

    EntradaBitacoraConfiguracion:
      type: object
      required:
        - id
        - usuarioId
        - fechaCambio
        - valorAnterior
        - valorNuevo
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          example: '00000248910'
        fechaCambio:
          type: string
          format: date-time
        valorAnterior:
          $ref: '#/components/schemas/ConfiguracionMensajes'
        valorNuevo:
          $ref: '#/components/schemas/ConfiguracionMensajes'

    MensajeCatalogoIA:
      type: object
      properties:
        id:
          type: string
          example: reactivacion-lote-hu1
        categoria:
          type: string
          enum: [ENVIO, RESPUESTA]
        nombre:
          type: string
          example: Reactivación de solicitud (Lote HU1)
        orden:
          type: integer
        grupo:
          type: string
          nullable: true
        pregunta:
          type: string
          nullable: true
        disparador:
          type: string
          enum: [AUTOMATICO, MANUAL, AUTOMATICO_Y_MANUAL, LOTE_HU1, RESPUESTA]
        canal:
          type: string
          example: WHATSAPP
        requierePlantillaMeta:
          type: boolean
        plantillaMeta:
          type: object
          nullable: true
          properties:
            referencia:
              type: string
            estado:
              type: string
              enum: [PENDIENTE, ENVIADA, APROBADA, RECHAZADA]
        texto:
          type: string
        variables:
          type: array
          items:
            type: string
        llaves:
          type: array
          items:
            type: object
            properties:
              tipo:
                type: string
              valor:
                type: string
        reglas:
          type: array
          items:
            type: string
        vistaPrevia:
          type: string

    EstadoHorarioEnvio:
      type: object
      properties:
        permitido:
          type: boolean
          example: true
        zonaHoraria:
          type: string
          example: America/Hermosillo
        fechaEvaluada:
          type: string
          format: date-time
        diaSemana:
          type: string
          example: martes
        diaActual:
          type: string
          example: Martes
        horaActual:
          type: string
          example: '10:30'
        horarioActual:
          type: string
          example: '10:30'
        horarioPermitidoHoy:
          $ref: '#/components/schemas/JornadaDia'
        siguienteApertura:
          type: string
          format: date-time
          nullable: true
        mensaje:
          type: string

paths:
  /health:
    get:
      tags: [Salud]
      summary: Verifica el estado operativo del servicio (alias /api/v1/health)
      operationId: obtenerSalud
      responses:
        '200':
          description: Servicio activo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  service:
                    type: string
                    example: sira-crm-backend
                  environment:
                    type: string
                    example: development
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
                  database:
                    type: object
                    properties:
                      host:
                        type: string
                      database:
                        type: string
                      schemasConfigured:
                        type: array
                        items:
                          type: string
                  eventBus:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [memoria, rabbitmq]
                      host:
                        type: string

  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      summary: Autentica a un colaborador o administrador y emite la cookie HttpOnly sira_session
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identificador
                - password
              properties:
                identificador:
                  type: string
                  description: ID institucional o correo institucional (`@potros.itson.edu.mx` / `@itson.edu.mx`).
                  example: '00000252115'
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Sesión iniciada correctamente.
          headers:
            Set-Cookie:
              description: Cookie `sira_session` con flags `HttpOnly`, `Path=/`, `SameSite=Lax` y `Max-Age`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  autenticado:
                    type: boolean
                    example: true
                  usuario:
                    $ref: '#/components/schemas/UsuarioSesion'
        '400':
          description: Faltan campos requeridos (`CAMPOS_REQUERIDOS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Credenciales inválidas (`CREDENCIALES_INVALIDAS`) o cuenta bloqueada en directorio (`CUENTA_BLOQUEADA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: Usuario sin autorización para SIRA o colaborador dado de baja en el CRM (`USUARIO_SIN_ACCESO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Proveedor de identidad institucional no disponible (`SERVICIO_NO_DISPONIBLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/auth/session:
    get:
      tags: [Autenticación]
      summary: Consulta la sesión activa actual
      operationId: obtenerSesionActual
      security:
        - cookieSesion: []
      responses:
        '200':
          description: Sesión activa y vigente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  autenticado:
                    type: boolean
                    example: true
                  expiraEn:
                    type: string
                    format: date-time
                  usuario:
                    $ref: '#/components/schemas/UsuarioSesion'
        '401':
          description: Sesión inexistente o expirada (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/auth/logout:
    post:
      tags: [Autenticación]
      summary: Invalida la sesión actual y limpia la cookie sira_session
      operationId: cerrarSesion
      security:
        - cookieSesion: []
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cerrado:
                    type: boolean
                    example: true

  /api/v1/monitoreo/filtros:
    get:
      tags: [Monitoreo]
      summary: Obtiene los catálogos de filtros disponibles para la cartera del colaborador autenticado (HU2-7)
      description: También accesible mediante el alias `/api/monitoreo/filtros`.
      operationId: obtenerFiltrosMonitoreo
      security:
        - cookieSesion: []
      responses:
        '200':
          description: Opciones de filtrado de la cartera del colaborador.
          content:
            application/json:
              schema:
                type: object
                properties:
                  carreras:
                    type: array
                    items:
                      type: string
                  preparatorias:
                    type: array
                    items:
                      type: string
                  periodos:
                    type: array
                    items:
                      type: string
                  estadosSolicitud:
                    type: array
                    items:
                      type: string
                  semaforos:
                    type: array
                    items:
                      type: string
        '401':
          description: Sin sesión activa (`NO_AUTORIZADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/monitoreo/aspirantes:
    get:
      tags: [Monitoreo]
      summary: Lista y filtra los aspirantes asignados a la cartera del colaborador autenticado (HU2-4, HU2-5)
      description: También accesible mediante el alias `/api/monitoreo/aspirantes`.
      operationId: listarAspirantesCartera
      security:
        - cookieSesion: []
      parameters:
        - name: busqueda
          in: query
          description: Búsqueda parcial por nombre o folio (insensible a mayúsculas y acentos). También acepta `nombre`.
          schema:
            type: string
        - name: semaforo
          in: query
          schema:
            type: string
            enum: [ROJO, NARANJA, AMARILLO, VERDE]
        - name: carrera
          in: query
          schema:
            type: string
        - name: preparatoria
          in: query
          schema:
            type: string
        - name: periodo
          in: query
          schema:
            type: string
        - name: estado_solicitud
          in: query
          schema:
            type: string
        - name: mostrar_aceptados
          in: query
          description: Si es `false`, oculta aspirantes con estado `ACEPTADA`.
          schema:
            type: boolean
            default: true
        - name: ordenar_por
          in: query
          schema:
            type: string
            enum: [semaforo, nombre, carrera, preparatoria, periodo, estado_solicitud, fecha_solicitud, ultima_actividad]
            default: fechaSolicitud
        - name: direccion
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista paginada de aspirantes de la cartera.
          content:
            application/json:
              schema:
                type: object
                properties:
                  aspirantes:
                    type: array
                    items:
                      $ref: '#/components/schemas/AspiranteResumen'
                  total:
                    type: integer
        '400':
          description: Parámetro de consulta inválido (`PARAMETRO_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Sin sesión activa (`NO_AUTORIZADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/monitoreo/aspirantes/{id}:
    get:
      tags: [Monitoreo]
      summary: Obtiene el detalle general del expediente de un aspirante de la cartera (HU3-3 / EQ-42)
      description: También accesible mediante `/api/monitoreo/aspirantes/{id}`.
      operationId: obtenerDetalleAspirante
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/AspiranteIdPath'
      responses:
        '200':
          description: Expediente del aspirante.
          content:
            application/json:
              schema:
                type: object
                properties:
                  aspirante:
                    $ref: '#/components/schemas/AspiranteResumen'
        '401':
          description: Sin sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: El aspirante pertenece a la cartera de otro colaborador (`SIN_PERMISO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Aspirante no encontrado (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/monitoreo/aspirantes/{id}/actividades:
    get:
      tags: [Monitoreo]
      summary: Obtiene la línea de tiempo (historial unificado) del aspirante ordenada del más reciente al más antiguo (HU3-6 / EQ-43)
      description: También accesible mediante `/api/monitoreo/aspirantes/{id}/actividades`.
      operationId: obtenerHistorialAspirante
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/AspiranteIdPath'
        - name: desde
          in: query
          description: Fecha/hora inicial inclusiva (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: hasta
