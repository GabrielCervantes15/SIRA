              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: El colaborador ya está inactivo (`YA_INACTIVO`) o es el único activo del campus (`SIN_COLABORADOR_RELEVO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/colaboradores/{id}/baja:
    post:
      tags: [Colaboradores]
      summary: Marca al colaborador como inactivo, reasigna equitativamente su cartera según HU6-2 y publica colaboradores.baja.confirmada (EQ-69 · HU6-10 / HU6-18)
      description: Exclusivo para rol `administrador`.
      operationId: confirmarBajaColaborador
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/ColaboradorIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tipo
              properties:
                tipo:
                  type: string
                  enum: [indefinido, periodo]
                  example: indefinido
                inicio:
                  type: string
                  format: date
                  description: Requerido cuando `tipo = "periodo"`.
                  example: '2026-11-26'
                fin:
                  type: string
                  format: date
                  description: Requerido cuando `tipo = "periodo"`.
                  example: '2027-01-15'
      responses:
        '200':
          description: Colaborador inactivado, cartera reasignada, bitácora registrada y evento publicado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmado:
                    type: boolean
                    example: true
                  colaborador:
                    type: object
                  reasignacion:
                    type: object
                  evento:
                    type: object
        '400':
          description: Duración o ID inválidos (`TIPO_BAJA_INVALIDO`, `FECHAS_BAJA_INVALIDAS`, `PERIODO_BAJA_INVALIDO`, `PERIODO_BAJA_VENCIDO`, `ID_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Sin sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: Rol distinto de administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Colaborador no encontrado (`COLABORADOR_NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: El colaborador ya está inactivo (`YA_INACTIVO`) o es el único activo de su campus (`SIN_COLABORADOR_RELEVO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/mensajes/configuracion:
    get:
      tags: [Mensajes - Configuración]
      summary: Obtiene la configuración vigente de tiempos de espera y jornada laboral por día (EQ-106 · HU9-5)
      description: Exclusivo para rol `administrador`. También acepta el alias `/api/mensajes/configuracion`.
      operationId: obtenerConfiguracionMensajes
      security:
        - cookieSesion: []
      responses:
        '200':
          description: Configuración vigente con equivalencias en horas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configuracion:
                    $ref: '#/components/schemas/ConfiguracionMensajes'
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: Rol distinto de administrador (`SIN_PERMISO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
    put:
      tags: [Mensajes - Configuración]
      summary: Valida y guarda de forma atómica la configuración de mensajes, registra bitácora y publica mensajes.configuracion.actualizada (EQ-107 · HU9-6 / EQ-108 · HU9-7)
      description: Exclusivo para rol `administrador`. También acepta el alias `/api/mensajes/configuracion`.
      operationId: guardarConfiguracionMensajes
      security:
        - cookieSesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tiempoEsperaRespuesta
                - tiempoEsperaContactoPrevio
                - jornada
              properties:
                zonaHoraria:
                  type: string
                  enum: [America/Hermosillo]
                tiempoEsperaRespuesta:
                  $ref: '#/components/schemas/ParametroTiempo'
                tiempoEsperaContactoPrevio:
                  $ref: '#/components/schemas/ParametroTiempo'
                jornada:
                  $ref: '#/components/schemas/JornadaSemanal'
      responses:
        '200':
          description: Configuración actualizada, entrada registrada en bitácora y evento publicado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  configuracion:
                    $ref: '#/components/schemas/ConfiguracionMensajes'
                  bitacora:
                    $ref: '#/components/schemas/EntradaBitacoraConfiguracion'
                  evento:
                    type: object
        '400':
          description: Configuración inválida (`CONFIGURACION_INVALIDA`) o JSON mal formado (`JSON_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: Rol distinto de administrador (`SIN_PERMISO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/mensajes/configuracion/bitacora:
    get:
      tags: [Mensajes - Configuración]
      summary: Lista la bitácora de auditoría de cambios en la configuración de mensajes del más reciente al más antiguo (EQ-108 · HU9-7)
      description: Exclusivo para rol `administrador`. También acepta `/api/mensajes/configuracion/bitacora`.
      operationId: listarBitacoraConfiguracionMensajes
      security:
        - cookieSesion: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Historial de modificaciones de configuración.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bitacora:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntradaBitacoraConfiguracion'
                  total:
                    type: integer
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: Rol distinto de administrador (`SIN_PERMISO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/mensajes-ia:
    get:
      tags: [Mensajes - Catálogo IA]
      summary: Lista el catálogo completo de mensajes predefinidos de envío y respuesta con vista previa (HU 8 · EQ-96, EQ-97)
      description: Solo lectura para ambos roles (`administrador` y `colaborador`). Cualquier método distinto de `GET` responde `405 SOLO_LECTURA`.
      operationId: listarCatalogoMensajesIA
      security:
        - cookieSesion: []
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
            enum: [ENVIO, RESPUESTA]
      responses:
        '200':
          description: Catálogo de mensajes predefinidos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  soloLectura:
                    type: boolean
                    example: true
                  mensajes:
                    type: array
                    items:
                      $ref: '#/components/schemas/MensajeCatalogoIA'
                  total:
                    type: integer
        '400':
          description: Categoría inválida (`CATEGORIA_INVALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '405':
          description: Intento de escritura sobre un catálogo de solo lectura (`SOLO_LECTURA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/mensajes-ia/{id}:
    get:
      tags: [Mensajes - Catálogo IA]
      summary: Obtiene el detalle y vista previa de un mensaje predefinido por ID (HU 8 · EQ-96)
      operationId: obtenerDetalleMensajeCatalogoIA
      security:
        - cookieSesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: reactivacion-lote-hu1
      responses:
        '200':
          description: Mensaje del catálogo encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  soloLectura:
                    type: boolean
                    example: true
                  mensaje:
                    $ref: '#/components/schemas/MensajeCatalogoIA'
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Mensaje no encontrado (`MENSAJE_NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/disparo-mensajes/vista-previa:
    get:
      tags: [Disparo Automático]
      summary: Calcula la vista previa de aspirantes elegibles para un lote de reactivación (HU 1 · EQ-81, EQ-82, EQ-84)
      description: |
        Puede consultarse incluso fuera del horario permitido de envío (`200 OK` con `dentroDeHorario: false`), permitiendo al colaborador inspeccionar su cartera antes de enviar.
      operationId: previsualizarLoteDisparo
      security:
        - cookieSesion: []
      parameters:
        - name: semaforos
          in: query
          description: Lista separada por comas de semáforos elegibles (`ROJO`, `NARANJA`, `AMARILLO`).
          schema:
            type: string
            example: ROJO,NARANJA
        - name: carreras
          in: query
          description: Lista separada por comas de carreras asignadas al colaborador.
          schema:
            type: string
        - name: inactividadValor
          in: query
          schema:
            type: integer
            example: 24
        - name: inactividadUnidad
          in: query
          schema:
            type: string
            enum: [horas, dias]
            example: horas
      responses:
        '200':
          description: Conteo de elegibles, desglose de excluidos, estado del horario en America/Hermosillo y ejemplos del mensaje personalizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valido:
                    type: boolean
                  errores:
                    type: object
                  carrerasDisponibles:
                    type: array
                    items:
                      type: string
                  semaforosDisponibles:
                    type: array
                    items:
                      type: string
                  fechaCorte:
                    type: string
                    format: date-time
                    nullable: true
                  horasContactoPrevio:
                    type: integer
                    example: 48
                  dentroDeHorario:
                    type: boolean
                  estadoHorario:
                    $ref: '#/components/schemas/EstadoHorarioEnvio'
                  mensajeHorario:
                    type: string
                  total:
                    type: integer
                  excluidos:
                    type: object
                  mensajesEjemplo:
                    type: array
                    items:
                      type: string
                  sinDatosParaMensaje:
                    type: integer
                  mensajeReactivacionDisponible:
                    type: boolean
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/disparo-mensajes/enviar:
    post:
      tags: [Disparo Automático]
      summary: Valida el horario permitido en el servidor, crea el lote de envío de forma idempotente y publica eventos por aspirante y canal (HU 1 · EQ-82, EQ-83, EQ-85)
      description: |
        Exclusivo para rol `colaborador`.
        - Consulta en vivo la jornada laboral vigente de **HU 9** (`America/Hermosillo`). Si el reloj del servidor está fuera del horario permitido, rechaza con `409 FUERA_DE_HORARIO_PERMITIDO` sin crear lotes ni publicar eventos.
      operationId: enviarLoteDisparo
      security:
        - cookieSesion: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clave opcional de idempotencia (`^[A-Za-z0-9_-]{8,100}$`) para evitar duplicar lotes ante reintentos de red.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{8,100}$'
            example: lote-20261126-colab01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - semaforos
                - carreras
                - inactividadValor
                - inactividadUnidad
              properties:
                semaforos:
                  type: array
                  items:
                    type: string
                    enum: [ROJO, NARANJA, AMARILLO]
                  example: [ROJO, NARANJA]
                carreras:
                  type: array
                  items:
                    type: string
                  example: [Ingeniería en Software]
                inactividadValor:
                  type: integer
                  minimum: 1
                  example: 24
                inactividadUnidad:
                  type: string
                  enum: [horas, dias]
                  example: horas
                enviarPorCorreo:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Lote creado (o recuperado por idempotencia) y eventos de envío publicados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loteId:
                    type: string
                    format: uuid
                  estado:
                    type: string
                    example: CREADO
                  creadoEn:
                    type: string
                    format: date-time
                  totalAspirantes:
                    type: integer
                  totalEnviosPendientes:
                    type: integer
                  noEnviables:
                    type: integer
                  repetido:
                    type: boolean
                  estadoHorario:
                    $ref: '#/components/schemas/EstadoHorarioEnvio'
        '400':
          description: Filtros inválidos (`FILTROS_LOTE_INVALIDOS`) o clave de idempotencia inválida (`CLAVE_IDEMPOTENCIA_INVALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: El usuario autenticado no tiene rol `colaborador` (`SIN_PERMISO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Envío rechazado por encontrarse fuera del horario laboral permitido (`FUERA_DE_HORARIO_PERMITIDO`), sin aspirantes elegibles (`LOTE_SIN_ELEGIBLES`) o clave de idempotencia reutilizada con otros filtros (`IDEMPOTENCIA_CONFLICTO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/disparo-mensajes/lotes/{loteId}:
    get:
      tags: [Disparo Automático]
      summary: Consulta el progreso y conteo de resultados (enviados, fallidos, diferidos, pendientes) de un lote del colaborador (HU 1 · EQ-87)
      operationId: obtenerEstadoLoteDisparo
      security:
        - cookieSesion: []
      parameters:
        - name: loteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumen de resultados del lote.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loteId:
                    type: string
                    format: uuid
                  estado:
                    type: string
                  creadoEn:
                    type: string
                    format: date-time
                  filtros:
                    type: object
                  totalAspirantes:
                    type: integer
                  aspirantesNotificados:
                    type: integer
                  enviados:
                    type: integer
                  fallidos:
                    type: integer
                  diferidos:
                    type: integer
                  pendientes:
                    type: integer
                  noEnviables:
                    type: integer
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Lote inexistente o perteneciente a otro colaborador (`LOTE_NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/webhooks/whatsapp:
    get:
      tags: [Webhooks WhatsApp]
      summary: Endpoint público de verificación de suscripción del Webhook de Meta (BASE-11 · EQ-115)
      operationId: verificarWebhookWhatsApp
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            example: subscribe
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token válido; devuelve el `hub.challenge` en texto plano.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify Token inválido o ausente.
    post:
      tags: [Webhooks WhatsApp]
      summary: Recibe notificaciones de eventos de WhatsApp Cloud API verificando la firma HMAC-SHA256 sobre los bytes crudos (BASE-11 · EQ-115)
      operationId: recibirNotificacionWebhookWhatsApp
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: Firma HMAC-SHA256 (`sha256=<hex>`) calculada con `WHATSAPP_APP_SECRET`.
          schema:
            type: string
            example: sha256=8f14e45fceea167a5a36dedd4bea2543
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - object
                - entry
              properties:
                object:
                  type: string
                  example: whatsapp_business_account
                entry:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Firma válida y evento publicado en el bus como `whatsapp.webhook.recibido`.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Cuerpo JSON inválido o estructura ajena a WhatsApp Business Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Firma `X-Hub-Signature-256` ausente o inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '413':
          description: Cuerpo superior al límite permitido (`PAYLOAD_DEMASIADO_GRANDE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
