  /api/v1/colaboradores:
    get:
      tags: [Colaboradores]
      summary: Lista los colaboradores por campus con datos del directorio y conteo real de aspirantes (EQ-71 · HU6-12)
      description: |
        Accesible tanto para `administrador` como para `colaborador`.
        - El parámetro `incluir_inactivos` solo surte efecto cuando el usuario autenticado tiene rol `administrador`.
      operationId: listarColaboradores
      security:
        - cookieSesion: []
      parameters:
        - name: campus
          in: query
          description: Nombre exacto del campus. Si no existe en el catálogo responde `400 CAMPUS_INVALIDO`.
          schema:
            type: string
            example: Campus Obregón Náinari
        - name: incluir_inactivos
          in: query
          description: Incluye colaboradores con `estado=inactivo` (`true` o `1`, solo aplicable para `administrador`).
          schema:
            type: boolean
            default: false
        - name: busqueda
          in: query
          description: Filtro parcial por nombre o ID institucional (insensible a mayúsculas y acentos).
          schema:
            type: string
      responses:
        '200':
          description: Listado de colaboradores y catálogo de campus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  colaboradores:
                    type: array
                    items:
                      $ref: '#/components/schemas/ColaboradorResumen'
                  total:
                    type: integer
                  campus:
                    type: array
                    items:
                      type: string
        '400':
          description: Campus no existente en el catálogo (`CAMPUS_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Sin sesión activa (`SESION_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

