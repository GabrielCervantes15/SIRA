name: SIRA CRM - CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Validación de Código, Lint y Pruebas Unitarias
  # ==========================================================================
  lint-and-test:
    name: Lint & Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validar sintaxis y estilo (Lint)
        run: npm run lint

      - name: Ejecutar pruebas unitarias (Node Test Runner)
        run: npm test

      - name: Probar ejecución de scripts con datos semilla
        run: npm run demo:registro-escolar

  # ==========================================================================
  # 2. Validación de Contenedores Docker y Compose
  # ==========================================================================
  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear archivo de entorno de prueba a partir de la plantilla
        run: cp .env.example .env

      - name: Validar sintaxis de docker-compose.yml
        run: docker compose config

      - name: Validar sintaxis de docker-compose.test.yml
        run: docker compose -f docker-compose.test.yml config

      - name: Construir imagen Docker en etapa de desarrollo
        run: docker build --target development -t sira-crm-backend:dev .

      - name: Construir y verificar etapa de pruebas en Docker
        run: docker build --target test -t sira-crm-backend:test .

      - name: Construir imagen final optimizada de producción
        run: docker build --target production -t sira-crm-backend:prod .
